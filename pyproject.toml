[project]
name = "geno_agent"
version = "0.1.0"
description = "Agentic Multi-Agent RAG for Gene Prioritization in Rare Mendelian Disease (TFM, Universidad UAX)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Johanna Angulo", email = "johanna.angulo@gmail.com" }]
requires-python = ">=3.12,<3.13"

# All versions pinned to what is installed in /home/hana77/pytorch-env (Python 3.12.3),
# the env shared with the user's other ML work that is known to function on the
# host's RTX 5090 (Blackwell, sm_120, requires CUDA 12.8+). The project does NOT
# create its own .venv — see master plan §10 for the deviation rationale.
#
# Reproducibility contract per master plan §4.1.3 / fix #6: any environment that
# reproduces these exact versions on the same hardware should yield byte-identical
# pipeline outputs. To freeze a snapshot, run:
#   source /home/hana77/pytorch-env/bin/activate && pip freeze > requirements.lock.txt
dependencies = [
    # Corpus processing (§2 line 183)
    "lxml==5.4.0",
    "requests==2.32.5",
    "tqdm==4.67.1",

    # Ontology handling (§2 line 186)
    "pronto==2.7.3",
    "obonet==1.1.1",
    "networkx==3.5",

    # Embedding and ML — torch is a CUDA 12.8 nightly required by the RTX 5090
    # (Blackwell sm_120). Master plan §2 line 189 specifies cu124 wheels; those
    # do not work on this hardware. Recorded in master plan §10.
    "torch==2.9.0.dev20250820+cu128",
    "torchvision==0.24.0.dev20250820+cu128",
    "torchaudio==2.8.0.dev20250820+cu128",
    "sentence-transformers==4.1.0",
    "transformers==4.55.3",
    "tokenizers==0.21.4",

    # Vector database + sparse embeddings (§2 line 193) — fastembed provides the
    # native Qdrant BM25 implementation per CLAUDE.md hard rule.
    "qdrant-client==1.14.3",
    "fastembed==0.8.0",

    # Phase 1B — phenopacket ingest (§2 line 196)
    "phenopackets==2.0.2.post5",

    # Data handling (§2 line 199)
    "pandas==2.2.3",
    "pyarrow==19.0.1",

    # Utilities (§2 line 202)
    "python-dotenv==1.0.1",
    "joblib==1.5.1",
    "psutil==7.0.0",

    # Phase 1A production corpus download (§3.1; required by scripts/corpus/01_download_pmc_oa.sh)
    "awscli==1.45.6",
]

[project.optional-dependencies]
# Developer tooling — install with `pip install -e ".[dev]"`
# (or just `pip install ruff==0.15.12 mypy==2.0.0 pytest==8.3.5 pre-commit==4.6.0`).
dev = [
    "ruff==0.15.12",
    "mypy==2.0.0",
    "pytest==8.3.5",
    "pre-commit==4.6.0",
    "pandas-stubs==3.0.0.260204",
]

[project.urls]
Homepage = "https://github.com/Jangulo7/geno_agent"
Issues = "https://github.com/Jangulo7/geno_agent/issues"

# ============================================================================
# Tooling configuration — see README and CLAUDE.md for project style rules.
# ============================================================================

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "data",
    "reports",
    "frontend",
    "logs",
    ".venv",
    "*.egg-info",
    "MASTER_PROJECT_v2.1.md",  # Markdown, not Python
]

[tool.ruff.lint]
# Selected rule families — extend cautiously; PRs should run clean.
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes (unused imports, undefined names)
    "I",      # isort (import sorting)
    "B",      # flake8-bugbear (likely bugs)
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify (refactor suggestions)
    "UP",     # pyupgrade (modern Python idioms)
    "N",      # pep8-naming
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long — `ruff format` handles wrapping
    "N803",   # argument names — scientific code uses HpId/HPO etc.
    "N806",   # local var names — same
    "SIM117", # nested with statements — sometimes clearer
    "UP007",  # Optional[X] vs X | None — both readable
]

[tool.ruff.lint.per-file-ignores]
# Numbered scripts (01_..., 06_..., ...) are intentionally not valid Python
# module names — the master plan §7 numbering convention requires them.
"scripts/**/[0-9]*.py" = ["N999"]
# Tests can use long lines and assert without check.
"tests/*.py" = ["E501", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["scripts", "src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ============================================================================

[tool.mypy]
python_version = "3.12"
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
# Explicit-only — we don't require type-checking the entire pipeline,
# only the Phase 2 application code (src/) and the seed util (foundational).
files = ["scripts/utils/seed.py", "src"]

[[tool.mypy.overrides]]
# These libraries don't ship public type stubs.
module = [
    "pronto",
    "pronto.*",
    "fastembed",
    "fastembed.*",
    "qdrant_client",
    "qdrant_client.*",
    "sentence_transformers",
    "sentence_transformers.*",
    "phenopackets",
    "phenopackets.*",
    "obonet",
    "tqdm",
    "tqdm.*",
    "dotenv",
]
ignore_missing_imports = true

# ============================================================================

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests requiring large data or GPU",
    "integration: marks tests requiring Qdrant/external services",
]
