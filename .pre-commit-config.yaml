# Pre-commit hooks — run automatically on `git commit`.
# Install once after cloning:
#   source /home/hana77/pytorch-env/bin/activate && pre-commit install
# Run manually against the whole repo:
#   pre-commit run --all-files
#
# Tool versions are pinned for reproducibility. Update via `pre-commit autoupdate`.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # data/ and release/ hold released artefacts whose SHA-256 digests are
      # cited in the manuscript and in data/MANIFEST.tsv. A hook that appends a
      # newline silently invalidates a published digest, so they are excluded.
      - id: trailing-whitespace
        exclude: ^(data/|release/)
      - id: end-of-file-fixer
        exclude: ^(data/|release/)
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
        # Two released artefacts are deliberately tracked despite their size: the
        # P1 manuscript states both are released, and the Figshare software
        # bundle is built with `git archive`, which can only emit tracked files.
        # Plain text, ~13 MB packed for the pair. The 1 MB ceiling still applies
        # to everything else, so an accidental data dump is still caught.
        exclude: |
          (?x)^(
            release/cohort/retained_pmcids\.txt|
            release/index_fingerprint/chunk_counts_by_pmcid\.tsv
          )$
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        files: ^(scripts/utils/seed\.py|src/)
        # Avoid pulling the entire project's heavy ML deps into pre-commit's
        # isolated venv; declare only the few stub packages we need here.
        additional_dependencies:
          - types-requests
          - pandas-stubs
