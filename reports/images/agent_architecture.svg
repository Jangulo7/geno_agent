<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 920" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="planner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf3fb"/><stop offset="1" stop-color="#cbe1f3"/>
    </linearGradient>
    <linearGradient id="retriever" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef0d6"/><stop offset="1" stop-color="#fcd9a3"/>
    </linearGradient>
    <linearGradient id="critic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fce4e4"/><stop offset="1" stop-color="#f3b3b3"/>
    </linearGradient>
    <linearGradient id="synth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6f4ea"/><stop offset="1" stop-color="#b8e0c7"/>
    </linearGradient>
    <linearGradient id="state" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4e6f0"/><stop offset="1" stop-color="#dab3ce"/>
    </linearGradient>
    <linearGradient id="io" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a4d8a"/><stop offset="1" stop-color="#0e2b4f"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <marker id="arrow-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#a23636"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.18"/>
    </filter>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1a2b3c">
    geno_agent — Agentic Multi-Agent RAG Architecture (master plan §11.1)
  </text>
  <text x="640" y="64" text-anchor="middle" font-size="13" fill="#566273">
    Four specialized agents · single shared AgentState · LangGraph state graph w/ self-correction loop
  </text>

  <!-- INPUT -->
  <g filter="url(#shadow)">
    <rect x="80" y="100" width="280" height="80" rx="12" fill="url(#io)"/>
    <text x="220" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="white">INPUT (Phase 1B test case)</text>
    <text x="220" y="148" text-anchor="middle" font-size="11.5" fill="white">case_id, hpo_terms[], candidate_genes[50]</text>
    <text x="220" y="166" text-anchor="middle" font-size="11" fill="#cfdcec">1 causal + 49 HGNC distractors</text>
  </g>

  <!-- OUTPUT -->
  <g filter="url(#shadow)">
    <rect x="920" y="100" width="280" height="80" rx="12" fill="url(#io)"/>
    <text x="1060" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="white">OUTPUT (Synthesizer)</text>
    <text x="1060" y="148" text-anchor="middle" font-size="11.5" fill="white">ranked: list[GeneCandidate]</text>
    <text x="1060" y="166" text-anchor="middle" font-size="11" fill="#cfdcec">symbol · confidence ∈ [0,1] · supporting_chunks · final_rank</text>
  </g>

  <!-- AgentState memory bus (center) -->
  <g filter="url(#shadow)">
    <rect x="380" y="100" width="520" height="100" rx="12" fill="url(#state)" stroke="#7a3a6c" stroke-width="1.6"/>
    <text x="640" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#3f1c38">AgentState — single in-process memory object</text>
    <g font-size="11" fill="#3a1535">
      <text x="395" y="146">Inputs: case_id, hpo_terms[], candidate_genes[]</text>
      <text x="395" y="162">Per-stage outputs: expanded_hpo[], mesh_queries[], retrieved{gene→chunks}, grades{gene→grades}, ranked[]</text>
      <text x="395" y="178">Loop control: iteration, max_iterations=3</text>
      <text x="395" y="194" font-style="italic">@dataclass(slots=True) — plain Python, no Pydantic, no LangGraph dep</text>
    </g>
  </g>

  <!-- Connector from input to AgentState -->
  <line x1="360" y1="140" x2="378" y2="140" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Connector from AgentState to output -->
  <line x1="900" y1="140" x2="918" y2="140" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- AGENT 1: Query Planner -->
  <g filter="url(#shadow)">
    <rect x="80" y="240" width="270" height="160" rx="12" fill="url(#planner)" stroke="#5483b4" stroke-width="1.4"/>
    <text x="215" y="266" text-anchor="middle" font-size="14" font-weight="700" fill="#1a3a5c">1. Query Planner</text>
    <g font-size="10.5" fill="#1a2b3c">
      <text x="92" y="290" font-weight="600">Input from state:</text>
      <text x="92" y="304">  hpo_terms[], candidate_genes[]</text>
      <text x="92" y="324" font-weight="600">Processing:</text>
      <text x="92" y="338">  · expand HPO via parent walk (d=2)</text>
      <text x="92" y="352">  · build per-gene query strings</text>
      <text x="92" y="366" font-weight="600">Output to state:</text>
      <text x="92" y="380">  expanded_hpo[], mesh_queries[]</text>
      <text x="92" y="394" font-style="italic" fill="#566273">Tools: HPO ontology (pronto)</text>
    </g>
  </g>

  <!-- AGENT 2: Retriever -->
  <g filter="url(#shadow)">
    <rect x="370" y="240" width="270" height="160" rx="12" fill="url(#retriever)" stroke="#cf8b1c" stroke-width="1.4"/>
    <text x="505" y="266" text-anchor="middle" font-size="14" font-weight="700" fill="#6e3e00">2. Retriever</text>
    <g font-size="10.5" fill="#3d2d10">
      <text x="382" y="290" font-weight="600">Input from state:</text>
      <text x="382" y="304">  candidate_genes[], mesh_queries[]</text>
      <text x="382" y="324" font-weight="600">Processing:</text>
      <text x="382" y="338">  · per-gene hybrid Qdrant search</text>
      <text x="382" y="352">  · dense + BM25 + RRF fusion</text>
      <text x="382" y="366" font-weight="600">Output to state:</text>
      <text x="382" y="380">  retrieved{gene → list[RetrievedChunk]}</text>
      <text x="382" y="394" font-style="italic" fill="#566273">Tools: Qdrant + PubMedBERT + BM25</text>
    </g>
  </g>

  <!-- AGENT 3: Critic -->
  <g filter="url(#shadow)">
    <rect x="660" y="240" width="270" height="160" rx="12" fill="url(#critic)" stroke="#a23636" stroke-width="1.4"/>
    <text x="795" y="266" text-anchor="middle" font-size="14" font-weight="700" fill="#5c1717">3. Critic</text>
    <g font-size="10.5" fill="#3d0e0e">
      <text x="672" y="290" font-weight="600">Input from state:</text>
      <text x="672" y="304">  retrieved{}, hpo_terms[]</text>
      <text x="672" y="324" font-weight="600">Processing per chunk:</text>
      <text x="672" y="338">  · gene mention valid? (HGNC alias)</text>
      <text x="672" y="352">  · relevance 1-5 + evidence type</text>
      <text x="672" y="366" font-weight="600">Output to state:</text>
      <text x="672" y="380">  grades{gene → list[CriticGrade]}</text>
      <text x="672" y="394" font-style="italic" fill="#566273">Tools: HGNC index, HPO labels</text>
    </g>
  </g>

  <!-- AGENT 4: Synthesizer -->
  <g filter="url(#shadow)">
    <rect x="950" y="240" width="270" height="160" rx="12" fill="url(#synth)" stroke="#3d8c5b" stroke-width="1.4"/>
    <text x="1085" y="266" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4f33">4. Synthesizer</text>
    <g font-size="10.5" fill="#1f3a26">
      <text x="962" y="290" font-weight="600">Input from state:</text>
      <text x="962" y="304">  candidate_genes[], grades{}</text>
      <text x="962" y="324" font-weight="600">Processing:</text>
      <text x="962" y="338">  · per-chunk contribution math</text>
      <text x="962" y="352">  · top-3 sum, normalize to [0,1]</text>
      <text x="962" y="366" font-weight="600">Output to state:</text>
      <text x="962" y="380">  ranked[] sorted by confidence</text>
      <text x="962" y="394" font-style="italic" fill="#566273">Tools: pure aggregation, no I/O</text>
    </g>
  </g>

  <!-- Sequential edges -->
  <line x1="350" y1="320" x2="368" y2="320" stroke="#444" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="640" y1="320" x2="658" y2="320" stroke="#444" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="930" y1="320" x2="948" y2="320" stroke="#444" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- State arrows up to AgentState -->
  <line x1="215" y1="240" x2="215" y2="200" stroke="#7a3a6c" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <line x1="505" y1="240" x2="505" y2="200" stroke="#7a3a6c" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <line x1="795" y1="240" x2="795" y2="200" stroke="#7a3a6c" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <line x1="1085" y1="240" x2="1085" y2="200" stroke="#7a3a6c" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <text x="640" y="225" text-anchor="middle" font-size="10" fill="#566273" font-style="italic">all agents read &amp; write the same state</text>

  <!-- Self-correction loop: Critic → Retriever -->
  <path d="M 660 380 Q 505 460 370 380" fill="none" stroke="#a23636" stroke-width="2.4" marker-end="url(#arrow-loop)" stroke-dasharray="6,4"/>
  <text x="505" y="468" text-anchor="middle" font-size="11.5" fill="#5c1717" font-weight="700">
    self-correction loop (max 3 iterations)
  </text>
  <text x="505" y="484" text-anchor="middle" font-size="10.5" fill="#5c1717" font-style="italic">
    if n_low_confidence_grades(≤2) &gt; 5 AND iteration &lt; max_iterations
  </text>

  <!-- TOOLS row -->
  <g filter="url(#shadow)">
    <rect x="80" y="520" width="1140" height="105" rx="12" fill="#f7f9fc" stroke="#d6dde7"/>
    <text x="100" y="546" font-size="13" font-weight="700" fill="#18242f">External tools &amp; data (loaded once per process)</text>

    <!-- Tool: HPO -->
    <g>
      <rect x="100" y="558" width="200" height="55" rx="8" fill="white" stroke="#5483b4"/>
      <text x="200" y="575" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a3a5c">HPO ontology</text>
      <text x="200" y="591" text-anchor="middle" font-size="10" fill="#566273">pronto.Ontology(hp.obo)</text>
      <text x="200" y="605" text-anchor="middle" font-size="10" fill="#566273">v2026-02-16, 19,944 terms</text>
    </g>

    <!-- Tool: HGNC -->
    <g>
      <rect x="320" y="558" width="200" height="55" rx="8" fill="white" stroke="#5483b4"/>
      <text x="420" y="575" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a3a5c">HGNC index</text>
      <text x="420" y="591" text-anchor="middle" font-size="10" fill="#566273">pandas + alias→canonical map</text>
      <text x="420" y="605" text-anchor="middle" font-size="10" fill="#566273">2026-04-07, 19,296 PC genes</text>
    </g>

    <!-- Tool: Qdrant -->
    <g>
      <rect x="540" y="558" width="200" height="55" rx="8" fill="white" stroke="#5483b4"/>
      <text x="640" y="575" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a3a5c">Qdrant + dense + BM25</text>
      <text x="640" y="591" text-anchor="middle" font-size="10" fill="#566273">qdrant-client 1.14.3 / server v1.14.1</text>
      <text x="640" y="605" text-anchor="middle" font-size="10" fill="#566273">PubMedBERT 768d + Qdrant/bm25</text>
    </g>

    <!-- Tool: LLM (planned) -->
    <g>
      <rect x="760" y="558" width="200" height="55" rx="8" fill="#f4f6fa" stroke="#b4becd" stroke-dasharray="4,4"/>
      <text x="860" y="575" text-anchor="middle" font-size="11.5" font-weight="700" fill="#566273">Qwen3-8B / vLLM (C7)</text>
      <text x="860" y="591" text-anchor="middle" font-size="10" fill="#566273">prompted variants of Planner/Critic</text>
      <text x="860" y="605" text-anchor="middle" font-size="10" fill="#566273">drop-in for deterministic versions</text>
    </g>

    <!-- Tool: LangGraph (planned) -->
    <g>
      <rect x="980" y="558" width="220" height="55" rx="8" fill="#f4f6fa" stroke="#b4becd" stroke-dasharray="4,4"/>
      <text x="1090" y="575" text-anchor="middle" font-size="11.5" font-weight="700" fill="#566273">LangGraph state graph (C7)</text>
      <text x="1090" y="591" text-anchor="middle" font-size="10" fill="#566273">conditional edges + AG-UI streaming</text>
      <text x="1090" y="605" text-anchor="middle" font-size="10" fill="#566273">today: pure-Python lockstep chain</text>
    </g>
  </g>

  <!-- METRICS / Phase 2a status row -->
  <g filter="url(#shadow)">
    <rect x="80" y="650" width="1140" height="220" rx="12" fill="#fffbf3" stroke="#fcd9a3"/>
    <text x="100" y="676" font-size="13" font-weight="700" fill="#6e3e00">Phase 2a status (deterministic baseline; LLM swap-in pending C7)</text>

    <g font-size="11" fill="#3d2d10">
      <text x="100" y="700" font-weight="700">Memory model:</text>
      <text x="240" y="700">single AgentState dataclass per case · in-process · no cross-case state · no external store</text>

      <text x="100" y="722" font-weight="700">Handoff protocol:</text>
      <text x="240" y="722">each node mutates state and returns it · LangGraph wraps for partial-update merging in C7</text>

      <text x="100" y="744" font-weight="700">Orchestration:</text>
      <text x="240" y="744">linear chain Q → R → C → S · Critic conditional edge re-enters Retriever (max 3 iter)</text>

      <text x="100" y="766" font-weight="700">Determinism:</text>
      <text x="240" y="766">all four agents pure-Python; same input → same output (regression-tested by 173 unit tests)</text>

      <text x="100" y="788" font-weight="700">Reproducibility:</text>
      <text x="240" y="788">RANDOM_SEED=42 · UUID5 chunk IDs · pinned PubMedBERT + Qdrant v1.14.1 · MANIFEST.tsv hashes</text>

      <text x="100" y="810" font-weight="700">Test coverage:</text>
      <text x="240" y="810">173 passing + 9 integration-skipped · ruff + mypy + pytest gated via pre-commit</text>

      <text x="100" y="832" font-weight="700">Hardware budget:</text>
      <text x="240" y="832">RTX 5090 32 GB VRAM · agents run CPU-bound today · LLM (C7) ~16 GB w/ vLLM</text>

      <text x="100" y="854" font-weight="700">LLM swap-in points:</text>
      <text x="240" y="854">build_mesh_queries (Planner) and grade_chunk (Critic) — interfaces stable</text>
    </g>
  </g>
</svg>
