<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bgInputs" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf3fb"/><stop offset="1" stop-color="#cbe1f3"/>
    </linearGradient>
    <linearGradient id="bgCorpus" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef0d6"/><stop offset="1" stop-color="#fcd9a3"/>
    </linearGradient>
    <linearGradient id="bgEmbed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6f4ea"/><stop offset="1" stop-color="#b8e0c7"/>
    </linearGradient>
    <linearGradient id="bgIndex" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4e6f0"/><stop offset="1" stop-color="#dab3ce"/>
    </linearGradient>
    <linearGradient id="bgRetrieve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fce4e4"/><stop offset="1" stop-color="#f3b3b3"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.18"/>
    </filter>
  </defs>

  <text x="600" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1a2b3c">
    geno_agent — Phase 1A pipeline architecture (master plan §7)
  </text>
  <text x="600" y="62" text-anchor="middle" font-size="13" fill="#566273">
    Demo path executed end-to-end on 100 articles in 44s; production path scales to ~150 GB / 5–9 days
  </text>

  <!-- INPUTS -->
  <g filter="url(#shadow)">
    <rect x="60" y="100" width="1080" height="100" rx="14" fill="url(#bgInputs)" stroke="#5483b4" stroke-width="1.4"/>
    <text x="80" y="128" font-size="14" font-weight="700" fill="#1a3a5c">INPUTS — pinned, hashed, reproducible</text>
    <g font-size="12" fill="#1a2b3c">
      <text x="80" y="156">• PMC OA full-text (NCBI esearch + efetch, 100 articles, 4 disease categories × 25)</text>
      <text x="80" y="176">• HPO v2026-02-16 · MONDO v2026-03-03 · GO 2026-03-25 · HGNC 2026-04-07 (SHA-256 in data/MANIFEST.tsv)</text>
      <text x="640" y="156">• PubMedBERT (NeuML/pubmedbert-base-embeddings, 768d)</text>
      <text x="640" y="176">• Qdrant native BM25 (Qdrant/bm25 via fastembed)</text>
    </g>
  </g>
  <line x1="600" y1="200" x2="600" y2="232" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- CORPUS PIPELINE -->
  <g filter="url(#shadow)">
    <rect x="60" y="232" width="1080" height="118" rx="14" fill="url(#bgCorpus)" stroke="#cf8b1c" stroke-width="1.4"/>
    <text x="80" y="260" font-size="14" font-weight="700" fill="#6e3e00">
      CORPUS PIPELINE — §7 steps 5a → 5d (~5s on demo)
    </text>
    <g font-size="11.5" fill="#3d2d10">
      <rect x="78" y="280" width="225" height="50" rx="6" fill="#fff" stroke="#bb7e1f"/>
      <text x="190" y="298" text-anchor="middle" font-weight="700">01 fetch_pmc.py</text>
      <text x="190" y="316" text-anchor="middle">esearch → efetch (HTTPS)</text>
      <text x="252" y="340" font-size="22" fill="#a06a18">→</text>
      <rect x="278" y="280" width="220" height="50" rx="6" fill="#fff" stroke="#bb7e1f"/>
      <text x="388" y="298" text-anchor="middle" font-weight="700">06 parse_jats_xml.py</text>
      <text x="388" y="316" text-anchor="middle">lxml → 559 sections</text>
      <text x="455" y="340" font-size="22" fill="#a06a18">→</text>
      <rect x="478" y="280" width="220" height="50" rx="6" fill="#fff" stroke="#bb7e1f"/>
      <text x="588" y="298" text-anchor="middle" font-weight="700">07 filter_corpus.py</text>
      <text x="588" y="316" text-anchor="middle">MeSH/regex → 89/100</text>
      <text x="655" y="340" font-size="22" fill="#a06a18">→</text>
      <rect x="678" y="280" width="442" height="50" rx="6" fill="#fff" stroke="#bb7e1f"/>
      <text x="899" y="298" text-anchor="middle" font-weight="700">08 section_aware_chunking.py</text>
      <text x="899" y="316" text-anchor="middle">UUID5 deterministic IDs · PubMedBERT tokenizer · 1,625 chunks</text>
    </g>
  </g>
  <line x1="600" y1="350" x2="600" y2="382" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- EMBEDDING -->
  <g filter="url(#shadow)">
    <rect x="60" y="382" width="1080" height="92" rx="14" fill="url(#bgEmbed)" stroke="#3d8c5b" stroke-width="1.4"/>
    <text x="80" y="410" font-size="14" font-weight="700" fill="#1f4f33">
      EMBEDDING — §7 step 5e (4.6s on RTX 5090, 351 chunks/s)
    </text>
    <g font-size="12" fill="#1f3a26">
      <text x="80" y="436">09 generate_embeddings.py — sentence-transformers · PubMedBERT-base (768d, mean-pooled, L2 normalized)</text>
      <text x="80" y="456">cu128 nightly torch on Blackwell sm_120 · output: parquet with binary embedding column (zstd)</text>
    </g>
  </g>
  <line x1="600" y1="474" x2="600" y2="506" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- INDEXING -->
  <g filter="url(#shadow)">
    <rect x="60" y="506" width="1080" height="118" rx="14" fill="url(#bgIndex)" stroke="#7a3a6c" stroke-width="1.4"/>
    <text x="80" y="534" font-size="14" font-weight="700" fill="#3f1c38">
      INDEXING — §7 step 5f (1s on demo); Qdrant 1.14.1
    </text>
    <g font-size="11.5" fill="#3a1535">
      <rect x="78" y="552" width="320" height="60" rx="6" fill="#fff" stroke="#7a3a6c"/>
      <text x="238" y="570" text-anchor="middle" font-weight="700">Dense vector "dense"</text>
      <text x="238" y="586" text-anchor="middle">768d · COSINE · HNSW m=16 / ef=200</text>
      <text x="238" y="602" text-anchor="middle">on_disk=True · L2-normalized</text>
      <rect x="408" y="552" width="320" height="60" rx="6" fill="#fff" stroke="#7a3a6c"/>
      <text x="568" y="570" text-anchor="middle" font-weight="700">Sparse vector "bm25"</text>
      <text x="568" y="586" text-anchor="middle">Qdrant native BM25 (fastembed)</text>
      <text x="568" y="602" text-anchor="middle">Modifier.IDF (server-side weighting)</text>
      <rect x="738" y="552" width="382" height="60" rx="6" fill="#fff" stroke="#7a3a6c"/>
      <text x="929" y="570" text-anchor="middle" font-weight="700">Payload + indices</text>
      <text x="929" y="586" text-anchor="middle">section_type · pmcid · pub_year (typed)</text>
      <text x="929" y="602" text-anchor="middle">on_disk_payload=True · 1,625 points / 5.5 MB parquet</text>
    </g>
  </g>
  <line x1="600" y1="624" x2="600" y2="656" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- RETRIEVAL -->
  <g filter="url(#shadow)">
    <rect x="60" y="656" width="1080" height="78" rx="14" fill="url(#bgRetrieve)" stroke="#a23636" stroke-width="1.4"/>
    <text x="80" y="682" font-size="14" font-weight="700" fill="#5c1717">
      RETRIEVAL VALIDATION — §7 step 6 (~5s, 12 probe queries)
    </text>
    <g font-size="12" fill="#3d0e0e">
      <text x="80" y="706">11 validate_index.py — dense (.encode) + BM25 (.query_embed, TF-only) → RRF fusion (Qdrant FusionQuery.RRF)</text>
      <text x="80" y="724">All 12 rare-disease probes return relevant top-1 hits (CVID, PKU, Marfan, DiGeorge, Noonan, Huntington, …)</text>
    </g>
  </g>
</svg>
